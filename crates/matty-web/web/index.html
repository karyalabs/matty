<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
    <title>Matty</title>
    <meta name="description" content="Matty, an unofficial Mattermost client." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f5f7; }
      @media (prefers-color-scheme: dark) { html, body { background: #111214; } }
      canvas { display: block; width: 100%; height: 100%; outline: 0; touch-action: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center;
        font: 14px/1.4 system-ui, sans-serif; color: #6b7280; }
      #loading[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="loading">Loading Matty…</div>
    <script type="module">
      import init from "./matty-web.js";
      const loading = document.getElementById("loading");
      if (!crossOriginIsolated) {
        loading.textContent = "Matty needs a cross-origin isolated page (COOP and COEP headers).";
      } else {
        // demo.<domain> opens the sample workspace, and its "Connect your
        // server" goes to the same path on <domain>, the app for real
        // servers, so those only allow that one origin. Local builds open the
        // demo too. ?demo=1 or ?demo=0 decides anywhere.
        const params = new URLSearchParams(location.search);
        const host = location.hostname;
        const demoHost = host.startsWith("demo.");
        const showDemo = params.has("demo")
          ? params.get("demo") !== "0"
          : demoHost || host === "localhost" || host === "127.0.0.1";
        if (demoHost) {
          window.mattyConnectUrl = `https://${host.slice("demo.".length)}${location.pathname}`;
        }
        // The app and the demo workspace download side by side; the app
        // reads the demo from window.mattyDemo as it starts. The app
        // compiles as it downloads, so the demo's wait doesn't hold it up.
        // The demo is gzipped by scripts/web, since hosts only compress text.
        const app = WebAssembly.compileStreaming(fetch("./matty-web_bg.wasm"));
        // The app keeps its settings and session in localStorage, which
        // Chrome writes to disk lazily: a browser quit or killed soon after
        // signing in could forget the session. The app hands every change
        // to mattyKept too, which keeps it in IndexedDB with strict
        // durability; that copy goes back into localStorage before the app
        // starts. Only changed entries are written back, so a launch adds no
        // localStorage write of its own.
        window.mattyKept = (() => {
          let opened;
          const store = (mode) => (opened ??= new Promise((resolve, reject) => {
            const request = indexedDB.open("matty", 1);
            request.onupgradeneeded = () => request.result.createObjectStore("kept");
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          })).then((db) => db.transaction("kept", mode, { durability: "strict" }).objectStore("kept"));
          const quietly = (promise) => promise.catch((error) => console.warn("mattyKept:", error));
          return {
            put: (key, value) => { quietly(store("readwrite").then((kept) => kept.put(value, key))); },
            remove: (key) => { quietly(store("readwrite").then((kept) => kept.delete(key))); },
            restore: () => quietly(store("readonly").then((kept) => new Promise((resolve, reject) => {
              const request = kept.openCursor();
              request.onsuccess = () => {
                const cursor = request.result;
                if (!cursor) return resolve();
                if (localStorage.getItem(cursor.key) !== cursor.value) {
                  localStorage.setItem(cursor.key, cursor.value);
                }
                cursor.continue();
              };
              request.onerror = () => reject(request.error);
            }))),
          };
        })();
        const restored = window.mattyKept.restore();
        const demo = !showDemo
          ? Promise.resolve(null)
          : fetch("./demo.sqlite.gz")
              .then((r) => (r.ok ? new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer() : null))
              .catch(() => null);
        Promise.all([demo, restored])
          .then(([bytes]) => { window.mattyDemo = bytes; return init({ module_or_path: app }); })
          .then(() => {
            loading.hidden = true;
            // sw.js serves this page and the app from the browser's copy on
            // the next launch, so it doesn't wait on the host. Hosted builds
            // only, so a local build is never served stale; ?sw=1 tries it.
            if ("serviceWorker" in navigator && (location.protocol === "https:" || params.get("sw") === "1")) {
              navigator.serviceWorker.register("./sw.js").catch(() => {});
            }
          })
          .catch((error) => {
            loading.textContent = "Matty could not start: " + error;
            // A copy that can't start isn't served again: reloading fetches
            // everything from the host.
            navigator.serviceWorker?.getRegistrations().then((all) => all.forEach((r) => r.unregister()));
            caches?.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
          });
      }
    </script>
  </body>
</html>
