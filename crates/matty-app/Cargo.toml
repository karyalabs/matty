[package]
name = "matty-app"
description = "The Matty GPUI app: windows, views, actions, keymap and settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
gpuicn.workspace = true
gpui-kit.workspace = true
gpui_platform.workspace = true
gpui-icons.workspace = true
hdrhistogram = { version = "7", default-features = false, optional = true }
web-time.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
image.workspace = true
matty-api.workspace = true
matty-sync.workspace = true
matty-markdown.workspace = true
matty-notify.workspace = true
matty-update.workspace = true
async-channel.workspace = true
getrandom.workspace = true
url.workspace = true
jiff.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
skrifa.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Syntax-highlighted code blocks; gpuicn has no highlighter on the web.
gpuicn = { workspace = true, features = ["syntect"] }
matty-spell.workspace = true
tracing-appender.workspace = true
sys-locale.workspace = true
keyring.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Who opens mattermost:// links, and asking to take them over (#489).
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "block2"] }
objc2-foundation = { workspace = true, features = ["NSURL"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix.workspace = true

# The tray icon for "Keep running when closed" (#634).
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
# The computer's idle time under X11, for the automatic Away.
x11rb = { version = "0.13", default-features = false, features = ["screensaver"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
# The computer's idle time, for the automatic Away.
windows = { version = "0.62", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "ClipboardEvent",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "KeyboardEventInit",
    "BlobPropertyBag",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "Navigator",
    "Storage",
    "Url",
    "Window",
    "Worker",
    "console",
] }
# The browser's clock and time zone, and a bundled zone database, since the
# web has no /usr/share/zoneinfo.
jiff = { workspace = true, features = ["js", "tzdb-bundle-always"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
gpuicn = { workspace = true, features = ["test-support"] }
matty-store.workspace = true
tempfile.workspace = true

[features]
# Compiles Metal shaders at runtime so macOS builds need no Xcode Metal toolchain.
runtime_shaders = ["gpui_platform/runtime_shaders"]
# Perf runs: GPUI's own frame and input-latency histograms (perf.rs).
gpui-profiler = ["gpui-kit/profiler", "dep:hdrhistogram"]
# Benchmark builds only: the session goes in the file MATTY_BENCH_SESSION_FILE
# names, not the credential store (secrets.rs). Never in a release.
bench-session-file = []
