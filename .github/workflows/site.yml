name: Site

# Builds and deploys https://matty.karyalabs.dev (site/README.md): when
# site/ changes on master, after each Release run (so the page shows the new
# version and its download links), and by hand. A pull request touching
# site/ only builds it.

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node site/build.mjs
          node --check site/worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: deploy matty.karyalabs.dev
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the release environment"
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: site
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
